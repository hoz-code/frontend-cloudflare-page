<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guarda tu palabra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Guarda la palabra que tú quieras</h1>
    
    <form id="wordForm">
      <input 
        type="text" 
        id="wordInput" 
        placeholder="Escribe una palabra..." 
        required 
        autocomplete="off"
      >
      <button type="submit">Guardar</button>
    </form>

    <div class="result-container">
      <p>Palabra guardada:</p>
      <span id="savedWordDisplay">Ninguna palabra guardada aún</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
